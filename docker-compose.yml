services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-EventPlanner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventplanner_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
      target: migrate
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-EventPlanner};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-eventplanner_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
      target: runtime
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-EventPlanner};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-eventplanner_dev_password}
      EmailSettings__SMTPHost: ${SMTP_HOST:-}
      EmailSettings__SMTPPort: ${SMTP_PORT:-587}
      EmailSettings__SMTPUser: ${SMTP_USER:-}
      EmailSettings__SMTPPass: ${SMTP_PASSWORD:-}
      EmailSettings__FromEmail: ${SMTP_FROM:-}
      EmailProvider: ${EMAIL_PROVIDER:-}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__BaseUrl: ${RESEND_BASE_URL:-https://api.resend.com/}
      Geoapify__ServerApiKey: ${GEOAPIFY_SERVER_KEY:-}
      Geoapify__BrowserApiKey: ${GEOAPIFY_BROWSER_KEY:-}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Storage__ImagePath: /app/data/uploads
      Storage__DataProtectionPath: /app/data/keys
    volumes:
      - app-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
