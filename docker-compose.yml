services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
      target: migrate
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=EventPlanner;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
      target: runtime
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=EventPlanner;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      EmailSettings__SMTPHost: ${SMTP_HOST:-}
      EmailSettings__SMTPPort: ${SMTP_PORT:-587}
      EmailSettings__SMTPUser: ${SMTP_USER:-}
      EmailSettings__SMTPPass: ${SMTP_PASSWORD:-}
      EmailSettings__FromEmail: ${SMTP_FROM:-}
      Geoapify__ServerApiKey: ${GEOAPIFY_SERVER_KEY:-}
      Geoapify__BrowserApiKey: ${GEOAPIFY_BROWSER_KEY:-}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Storage__ImagePath: /app/data/uploads
      Storage__DataProtectionPath: /app/data/keys
    volumes:
      - app-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sql-data:
  app-data:
